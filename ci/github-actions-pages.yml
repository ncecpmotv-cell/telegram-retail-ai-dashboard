# Optional GitHub Actions deploy for telegram-retail-ai-dashboard.
#
# The repo currently uses GitHub Pages "Deploy from a branch" (legacy) mode,
# which deploys the static site from main with zero configuration and no
# workflow. Use THIS file only if you want the Actions-based deploy
# (e.g. to add a node --check gate before publishing):
#
#   1. Copy this file to  .github/workflows/pages.yml
#   2. Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   3. Push. Note: GitHub rejects pushes that create workflow files unless
#      the token has the `workflow` scope (OAuth apps) — use a classic PAT
#      or an SSH key push.

name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for f in assets/js/*.js; do node --check "$f"; done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
